name: Release

on:
  # Release only commits whose Build passed on main, so a broken build cannot
  # cut a release branch whose CI then fails.
  workflow_run:
    workflows:
      - Build
    types:
      - completed
    branches:
      - main

  workflow_dispatch:
    inputs:
      version:
        description: Version to release (semver, "auto", "major", "minor", "patch")
        default: minor
        required: false
      force:
        description: Force release
        default: false
        type: boolean
      merge_target:
        description: Merge target branch
        default: main
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: Release a new version
    # Only commits whose Build passed on main, pushed to this repository.
    # Release merges run too: preflight releases the commits that landed while
    # that release was pending, and does nothing when there are none.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    # Apply concurrency after the guard so skipped runs cannot take the queue.
    # Never cancel a running release: it may have pushed its branch already.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - name: Get auth token
        id: token
        uses: actions/create-github-app-token@f8d387b68d61c58ab83c6c016672934102569859 # v3.0.0
        with:
          app-id: ${{ vars.SENTRY_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.SENTRY_RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          token: ${{ steps.token.outputs.token }}
          fetch-depth: 0
          # The commit whose Build passed. Manual runs use the ref they were
          # dispatched on.
          ref: ${{ github.event.workflow_run.head_sha }}

      # Craft prepares from the current branch and expects the default branch,
      # so put a local main on the commit that Build checked.
      - name: Put main on the built commit
        if: github.event_name == 'workflow_run'
        run: git checkout -B main

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Check what to release
        id: preflight
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RELEASE_TRIGGER: ${{ github.event_name }}
        run: .github/scripts/release-preflight.sh

      - name: Prepare release
        if: steps.preflight.outputs.proceed == 'true'
        uses: getsentry/craft@2e29b0819113d334c15da3d8cac2138cb9dc111a # 3.9.0
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
        with:
          version: ${{ inputs.version }}
          force: ${{ inputs.force }}
          merge_target: ${{ inputs.merge_target || 'main' }}
