name: Release pipeline health

on:
  workflow_run:
    workflows:
      - Build
      - Release
    types:
      - completed
    branches:
      - main
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# One writer at a time, so two failures cannot open two issues.
concurrency:
  group: release-pipeline-health
  cancel-in-progress: false

jobs:
  # Build and Release on main: report failures, and close the issue once a
  # Release succeeds.
  report-run:
    name: Report ${{ github.event.workflow_run.name }} result
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.name == 'Release' || github.event.workflow_run.event == 'push') &&
      (
        github.event.workflow_run.conclusion == 'failure' ||
        (github.event.workflow_run.name == 'Release' && github.event.workflow_run.conclusion == 'success')
      )
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_LINK: "[${{ github.event.workflow_run.name }} run #${{ github.event.workflow_run.run_number }}](${{ github.event.workflow_run.html_url }})"
      COMMIT_LINK: "[`${{ github.event.workflow_run.head_sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }})"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Report the failure
        if: github.event.workflow_run.conclusion == 'failure'
        env:
          MESSAGE: ${{ env.RUN_LINK }} failed on `main` at ${{ env.COMMIT_LINK }}.
        run: .github/scripts/pipeline-issue.sh report

      - name: Close the issue
        if: github.event.workflow_run.conclusion == 'success'
        env:
          MESSAGE: ${{ env.RUN_LINK }} succeeded on `main` at ${{ env.COMMIT_LINK }}.
        run: .github/scripts/pipeline-issue.sh resolve

  # Catch releases that are stuck without a failing run, such as a release
  # branch that never merged.
  check-staleness:
    name: Check for a stuck release
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: main
          # The check needs history and tags, but not the schema blobs.
          fetch-depth: 0
          filter: blob:none

      - run: .github/scripts/check-release-staleness.sh
