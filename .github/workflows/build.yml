name: Build

on:
  push:
    branches:
      - main
      - release/**
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Minimum supported Node (engines.node). This job uploads the release artifact.
          - name: Build
            node: "22"
            pack: true
          - name: Build (Node LTS)
            node: lts/*
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # Workflows run .github/scripts/* directly, so each one must be executable.
      - if: matrix.pack
        name: Check workflow scripts are executable
        run: .github/scripts/check-script-modes.sh

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      - if: matrix.pack
        run: npm pack

      - if: matrix.pack
        name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: "*.tgz"
